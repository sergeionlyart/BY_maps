# INF-15 «Полотно» (grid) — реестр главных утверждений.
# Схема: ТЗ §3.1 (INF-12), адаптирована. Классы: DATA — прямо в источнике;
# CALC — детерминированное преобразование; MODEL — зависит от статистической/
# пространственной модели; INTERPRETATION — содержательная интерпретация;
# LIMITATION — ограничение, способное изменить вывод.
# status: verified | open_question | refuted | supported_with_caveats -
# "open_question" присвоен C-1/C-2 буквально по предписанию раздела 7 ТЗ
# (проверка 3): G-3 не пройдена (32.8% < 70%), поэтому эти два утверждения
# НЕ подаются как подтверждённые, несмотря на то, что сами по себе (без
# независимого сенсора) они бы прошли собственные тесты - см. docs/decisions/
# INF-15.md D-007 и VALIDATION.md.
# Каноническая сводка — data/final/computed_results.json.

version: "1.0.0"
frozen_metrics: 2026-07-26     # docs/preregistration/grid-v0.1.md
primary_frame: CONSTRAINED_DASYMETRIC   # D-005: районные/нац. итоги = офиц. ряд
main_interval: {start: 1975, end: 2020}

claims:

  - claim_id: C-001
    text: >-
      Плотность населения, взвешенная по числу жителей (population-weighted
      density), растёт на всём наблюдаемом ряду 1975-2020, даже когда обычная
      (арифметическая) плотность страны падает (наблюдается на подпериоде
      1990-2020: 48.9 -> 44.9 чел/км²) - люди концентрируются быстрее, чем
      пустеет территория.
    type: CALC
    metric_ids: [population_weighted_density, arithmetic_density]
    scope: "вся территория Беларуси, сетка 1 км, constrained-калибровка (D-005)"
    period: {start: 1975, end: 2020}
    frame: CONSTRAINED_DASYMETRIC
    source_result:
      file: data/final/computed_results.json
      filter: "national_pw_density_2020 > national_pw_density_1975 and national_arith_density_2020 < national_arith_density_1990"
      cross_check:
        file: sources/raw/metrics_observed.json
        filter: "national_raw.population_weighted_density['2020'] > national_raw.population_weighted_density['1990'] (тот же знак на сырых, не только откалиброванных данных)"
    caveats:
      - "G-3 (перекрёстная проверка с ночными огнями VIIRS, 2012-2020) НЕ пройдена: согласие знака изменения население/огни всего 32.8% (порог 70%) - см. C-004 ниже. Раздел 7 ТЗ предписывает подавать C-1 как открытый вопрос, а не подтверждение, при таком исходе."
      - "Внутрирайонный пространственный рисунок остаётся допущением GHS-POP (constrained-калибровка чинит только СУММУ по району, не то, где именно внутри района сконцентрирован прирост) - потенциальный confound «города-хозяева переоценены vs пригороды недооценены» на уровне района не проверен на подрайонном масштабе (третий проверяющий, ревью D-005)."
      - "Малозаселённые/эвакуированные зоны (Чернобыль) искажены дазиметрией сильнее прочих - см. LIMITATIONS.md."
    status: open_question

  - claim_id: C-002
    text: >-
      Доля площади страны с плотностью ниже 5 чел/км² растёт монотонно (в
      пределах шума округления) на всём ряду 1975-2020 и продолжает расти до
      2050 во всех сценариях/вариантах прогноза; рост не объясняется только
      Полесьем и Чернобылем (устойчив к их исключению, G-4).
    type: CALC
    metric_ids: [area_share_below]
    scope: "вся территория Беларуси; G-4 пересчитан без 36 районов (27 полесских + 12 чернобыльских, пересечение возможно)"
    period: {start: 1975, end: 2050}
    frame: CONSTRAINED_DASYMETRIC
    source_result:
      file: data/final/computed_results.json
      filter: "national_below5_2020 > national_below5_1975 and g4_growth_1975_2020_excl_polesye_chernobyl > 0"
    caveats:
      - "Как и C-001, публикуется со статусом «открытый вопрос» из-за провала G-3 (см. C-004) - раздел 7 ТЗ."
      - "Прогнозная часть (2026-2050) опирается на сильное допущение продолжения внутрирайонного тренда (вариант A) либо на явно стилизованную пригородно-периферийную корректировку (вариант Б, docs/decisions/INF-15.md D-006) - не измерение."
    status: open_question

  - claim_id: C-003
    text: >-
      Метров дорожной сети на одного жителя больше там, где депопуляция района
      сильнее (1989-2026) - «навес сети» существует не только в городах
      (INF-12), но и вне них. Подтверждено: корреляция Спирмена
      network_per_capita_2026 (км/1000 жителей) против темпа изменения
      численности района 1989-2026 = -0.7508 (p ≈ 1.25e-22, 118 районов) -
      отрицательная и высоко значимая.
    type: CALC
    metric_ids: [network_per_capita]
    scope: "118 районов + Минск (Минск в корреляцию C-3 не включён - только районы); дорожная сеть - снимок OSM 2026 года (не история, раздел 8 ТЗ п.4)"
    period: {start: 2026, end: 2026}
    frame: OSM_SNAPSHOT_2026
    source_result:
      file: data/final/computed_results.json
      filter: "c3_spearman_rho < 0 and c3_p_value_log10 < -3 and g6_pass == 1"
    caveats:
      - "G-6 (полнота карты дорог) ПРОЙДЕНА: сумма OSM 76 958.8 км против официальных 86 446 км (РУП «Белдорцентр», данные на 01.01.2026) - отклонение -10.97%, в допуске ±15%. Показатель публикуется с абсолютными км (не только относительный индекс)."
      - "Снимок OSM (INF-04) содержит только классы motorway/trunk/primary/secondary/tertiary (+_link) - без residential/unclassified/track; официальная статистика включает ВСЕ дороги общего пользования. Сравнение - общий итог против общего итога, не классовое сопоставление 1:1 (см. VALIDATION.md)."
      - "Метрика частично механическая: km/1000 жителей растёт при падении численности почти арифметически (длина сети фиксирована, знаменатель падает) - раздел 8 ТЗ п.4: снимок сети на 2026 год, не история («сеть выросла» - запрещённая формулировка, раздел 8 §8 пререгистрации)."
      - "Проверка на устойчивость после исключения городских районов INF-12 (доп. пункт контракта опровержения, §7 пререгистрации) не выполнена отдельно - базовая корреляция достаточно сильна (|ρ|>0.75), доп. проверка не требовалась по контракту опровержения (нужна только если базовая корреляция слаба/неоднозначна)."
      - "2 района потребовали запасной год сравнения (r-drybinski: 1989->1999 вместо 1989; r-chervienski: 2026->2025) - отмечены is_fallback=true в данных, не скрыты."
    status: verified
