sources:
  - id: ghs_pop_r2023a
    url: "https://human-settlement.emergency.copernicus.eu/download.php?ds=pop"
    description: "GHS-POP R2023A: население мира по клеткам 1 км, Молльвейде, эпохи 1975-2020 (шаг 5 лет); 40 тайлов (4 на эпоху) с URL+sha256 в sources/raw/registry_ghsl_pop.csv"
    license: "CC BY 4.0 (Schiavina, Freire, MacManus (2023), European Commission JRC, GHS-POP R2023A)"
    accessed: "2026-07-26"
    sha256: ""
    vendored: "sources/raw/registry_ghsl_pop.csv"
    fetch: "python3 code/extract/grid_fetch.py"
  - id: bymaps_data_json
    url: "https://by-population-maps.vercel.app/data/data.json"
    description: "Официальные ряды населения 118 районов + Минска (переписи Белстата 1959-2019, оценки; проект BY Maps)"
    license: "использование с указанием источника (Белстат, компиляция pop-stat.mashke.org)"
    accessed: "2026-07-26"
    sha256: ""
    vendored: "sources/raw/metrics_observed.json (пере-агрегировано)"
    fetch: "см. пакет by-maps-zipf / основной репозиторий web/public/data/data.json"
  - id: bymaps_forecast_json
    url: "https://by-population-maps.vercel.app/data/forecast.json"
    description: "Прогноз населения районов до 2075 (версия v2026.4, 3 сценария), проект BY Maps"
    license: "CC BY 4.0 (BY Maps)"
    accessed: "2026-07-26"
    sha256: ""
    vendored: "sources/raw/metrics_forecast.json (пере-агрегировано)"
    fetch: "основной репозиторий web/public/data/forecast.json"
  - id: inf07_chernobyl_zones
    url: "https://by-population-maps.vercel.app/artifacts/chernobyl"
    description: "Классификация районов по чернобыльским зонам (data/curated/chernobyl_zones.csv, INF-07)"
    license: "CC BY 4.0 (BY Maps)"
    accessed: "2026-07-26"
    sha256: ""
    vendored: "используется на этапе расчёта G-4 (не хранится отдельно в пакете - производный список см. VALIDATION.md)"
    fetch: "основной репозиторий data/curated/chernobyl_zones.csv"
  - id: inf08_nightlights_v2
    url: "https://by-population-maps.vercel.app/artifacts/nightlights"
    description: "Зональная светимость VIIRS по районам (nightlights_v2.json, сегмент 2012-2024), проект BY Maps INF-08 v2 - использована для перекрёстной проверки G-3"
    license: "CC BY 4.0 (Li et al.; EOG VNL, вырезки и агрегация BY Maps)"
    accessed: "2026-07-26"
    sha256: ""
    vendored: "sources/raw/g3_nightlights_crosscheck.json, g3_nightlights_rows.csv"
    fetch: "пакет by-maps-nightlights-v2.2.0 (или актуальная версия)"
  - id: inf04_osm_road_graph
    url: "https://download.geofabrik.de/europe/belarus-latest.osm.pbf"
    description: "Дорожный граф Беларуси (etl/osm_graph.py, INF-04), классы motorway..tertiary со скоростями"
    license: "ODbL 1.0 (© OpenStreetMap contributors)"
    accessed: "2026-07-11"
    sha256: ""
    vendored: "sources/raw/network_by_raion.csv (агрегировано по районам/классам)"
    fetch: "основной репозиторий data/raw/osm/graph_edges.csv.gz"
  - id: osm_river_graph_v3
    url: "https://download.geofabrik.de/europe/belarus-latest.osm.pbf"
    description: "Слой рек Беларуси (etl/osm_rivers.py, доработка v3), waterway=river; повторная выгрузка Geofabrik 2026-07-27 (свежее снимка дорог 2026-07-10 - расхождение раскрыто, см. docs/decisions/INF-15.md D-015); для расчётов используются только реки длиной >=20 км в границах Беларуси (docs/preregistration/grid-v0.2.md §8.4)"
    license: "ODbL 1.0 (© OpenStreetMap contributors)"
    accessed: "2026-07-28"
    sha256: "e1d690ea84f8c289336d251a3f6b6304a86f3683c3f641fa4d1c38c44cc84774"
    vendored: "sources/raw/river_edges.csv.gz"
    fetch: "основной репозиторий data/raw/osm/river_edges.csv.gz"

entrypoints:
  reproduce: "code/run.sh"
  verify: "python3 code/verify.py"

environment:
  python: ">=3.10"
  lock: "code/requirements.lock"
  seed: 42

# Контрольные значения покрывают все ключевые числа лендинга (G-7, раздел 7 ТЗ).
expected_results:
