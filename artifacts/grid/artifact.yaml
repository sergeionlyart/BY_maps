      description: "доля площади страны с плотностью <5 чел/км², 1975 (constrained)" }
  - { metric: national_below5_2020, value: 0.7422, tolerance: 0.0001,
      description: "доля площади страны с плотностью <5 чел/км², 2020 (constrained)" }
  - { metric: national_pw_density_1975, value: 3105.573, tolerance: 0.01,
      description: "плотность, взвешенная по населению, 1975" }
  - { metric: national_pw_density_2020, value: 5657.336, tolerance: 0.01,
      description: "плотность, взвешенная по населению, 2020" }
  - { metric: national_arith_density_1990, value: 48.883, tolerance: 0.01,
