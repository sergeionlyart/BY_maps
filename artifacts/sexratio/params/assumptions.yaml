# Все допущения INF-20 с обоснованиями. Файл ДОКУМЕНТИРУЕТ допущения и кодом
# не читается: для стресс-теста правьте константы в etl/sexratio.py и
# перезапускайте code/run.sh — рецепты в AGENT.md.

perimeter:
  value: "периметр прогноза: переписной район + его город областного подчинения (карта HOSTED)"
  why: >
    чтобы ряд 2009 -> 2056 был непрерывным; переписной периметр используется в
    пост-хок проверке H1 и даёт тот же знак

fertile_group:
  value: "25-39 = 25-29 + 30-34 + 35-39"
  why: "брачно-репродуктивный возраст; основная доля рождений в Беларуси"

old_group:
  value: "70+ = 70-74 + 75-79 + 80+"
  why: "возраст, где сверхсмертность мужчин накоплена; прокси вдовства"

survival:
  value: "покогортно по годовым qx периодных таблиц 2009-2018; qx = deaths / survivors; 2019 берёт таблицу 2018"
  why: >
    таблица 2018 — последняя доступная; qx из отношения столбцов исключает
    неоднозначность единиц поля probability_of_death; внутри пятилетней группы
    выживание усредняется по пяти однолетним возрастам

onset_thresholds:
  value: {high: 115, low: 85}
  why: "коридор, вне которого перекос в 25-39 заметно влияет на брачный рынок; описательная метрика, не гипотеза"

spearman_p:
  value: "нормальное приближение z = |rho| * sqrt(n - 1)"
  why: "при n = 118 точности достаточно; порог H1 задан на rho, p вторичен"

narrow_age_spike:
  value: "район с отношением 25-39 >= 115 и пиком >= 130 в одной из групп 15-19..30-34"
  why: "описательная подпись закрытых учреждений; пост-хок, введён после данных"

core_scenario:
  value: "base:official"
  why: "опорный сценарий проекта; H4 и onset считаются на нём, остальные пять комбинаций — в sexratio.json"
