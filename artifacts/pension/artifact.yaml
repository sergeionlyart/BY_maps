entrypoints:
  reproduce: "code/run.sh"
  verify: "python3 code/verify.py"

environment:
  python: ">=3.10"
  lock: "code/requirements.lock"
  seed: null   # расчёт детерминирован, случайности нет

# Контрольные значения покрывают H1 (доля районов SR<1,5 2009 vs 2046),
# H2 (CV(SR) 2026 vs 2046), национальный и районный CALC-слой, MODEL-слой
# (CG Кореличского района, число подавленных G-7) и DATA-слой (гейт G-1).
expected_results:
  - { metric: national_sr_2009, value: 2.73, tolerance: 0.01,
      description: "SR страны, 1989-2019: перепись 2009, as_is/base:official" }
  - { metric: national_sr_2046, value: 1.68, tolerance: 0.01,
      description: "SR страны, прогноз 2046, базовый сценарий, официальный старт" }
  - { metric: national_sr_2056, value: 1.41, tolerance: 0.01,
      description: "SR страны, прогноз 2056, базовый сценарий, официальный старт" }
  - { metric: national_crossing_year_1_5, value: 2050, tolerance: 0,
      description: "год перехода порога SR<1,5 страной (as_is, base:official) - точный год, не завязан на G-3" }
  - { metric: national_crossing_year_2_0, value: 2038, tolerance: 0,
      description: "год перехода порога SR<2,0 страной (as_is, base:official)" }
  - { metric: raions_below_1_5_2009, value: 1, tolerance: 0,
      description: "районов из 118 с SR<1,5 в 2009 году (H1: пререгистрация ожидала 0 - фактически 1, Кореличский район, см. docs/decisions/INF-13.md)" }
  - { metric: raions_below_1_5_2046, value: 69, tolerance: 0,
      description: "районов из 118 с SR<1,5 в 2046 году, базовый сценарий (H1: 58,5% > 50%)" }
  - { metric: karelicki_sr_2009, value: 1.48, tolerance: 0.01,
      description: "SR Кореличского района, перепись 2009 - единственный район ниже 1,5 уже в 2009" }
  - { metric: karelicki_sr_2046, value: 1.05, tolerance: 0.01,
      description: "SR Кореличского района, прогноз 2046, base:official" }
  - { metric: karelicki_cg_2046, value: 0.53, tolerance: 0.02,
      description: "CG (MODEL) Кореличского района, 2046, base:official - условный индекс, не показатель реальных выплат" }
  - { metric: cg_suppressed_count, value: 5, tolerance: 0,
      description: "районов с подавленным CG (G-7: зона <=45 мин доступности до Минска)" }
  - { metric: cv_sr_2026, value: 0.1907, tolerance: 0.002,
      description: "межрайонный коэффициент вариации SR, 2026 (H2: должен вырасти к 2046)" }
  - { metric: cv_sr_2046, value: 0.193, tolerance: 0.002,
      description: "межрайонный коэффициент вариации SR, 2046 (H2: 0,193 > 0,191 в 2026 - формально подтверждает H2)" }
  - { metric: sd_sr_2026, value: 0.3811, tolerance: 0.002,
      description: "межрайонное стандартное отклонение SR, 2026 (находка B скептика: абсолютный разброс, в отличие от CV, СУЖАЕТСЯ к 2046 - см. LIMITATIONS.md)" }
  - { metric: sd_sr_2046, value: 0.2849, tolerance: 0.002,
      description: "межрайонное стандартное отклонение SR, 2046 - на 25% ниже 2026 года: страна сходится к более низкому общему уровню, а не расслаивается в абсолютном выражении" }
  - { metric: g1_share_above_model, value: 24.56, tolerance: 0.05,
      description: "гейт G-1: модельная доля населения старше трудоспособного возраста на 01.01.2025, %, против эталона Белстата 24,57%" }
