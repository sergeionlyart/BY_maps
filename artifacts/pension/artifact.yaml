# Декларативное описание проверяемого пакета INF-13 `pension`
# (ARTIFACT_STANDARD.md v1.0). Сборка: python -m etl.artifacts.build pension

id: pension
title: "Кто кого содержит: коэффициент поддержки, нагрузка и год перехода по 118 районам Беларуси, 1989-2056"
version: "1.0.0"
released: "2026-07-26"
landing_url: "https://by-population-maps.vercel.app/research/pension"
authors:
