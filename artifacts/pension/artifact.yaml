  # итоговые данные - ровно те, что на лендинге (регенерируются тем же
  # прогоном run.sh; здесь - опубликованный снимок)
  - { path: web/public/data/pension.json, from: web/public/data/pension.json, role: final, license: "CC BY 4.0" }
  - { path: data/curated/pension_inputs.csv, from: data/curated/pension_inputs.csv, role: final, license: "CC BY 4.0" }
  - { path: docs/notes/pension_validation.md, from: docs/notes/pension_validation.md, role: final, license: "CC BY 4.0" }
  # контрольный снимок (без from: - лежит в самом пакете, см.
  # ARTIFACT_STANDARD.md; регенерируется code/verify.py при каждом прогоне)
