  - { path: data/raw/wages/wage_10218000003_2020-2026.json, from: data/raw/wages/wage_10218000003_2020-2026.json, role: intermediate, license: "открытые данные Белстата" }
  - { path: data/raw/wages/empl_person_10102000017_2010-2019.json, from: data/raw/wages/empl_person_10102000017_2010-2019.json, role: intermediate, license: "открытые данные Белстата" }
  - { path: data/raw/wages/empl_person_10102000017_2020-2026.json, from: data/raw/wages/empl_person_10102000017_2020-2026.json, role: intermediate, license: "открытые данные Белстата" }
