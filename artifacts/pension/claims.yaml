# INF-13 «Кто кого содержит» (pension) — реестр главных утверждений.
# Схема (по образцу artifacts/urban-overhang/claims.yaml): DATA — прямо в
# источнике; CALC — детерминированное преобразование данных фиксированной
# формулой (без внешнего допущения сверх самого законного графика
# пенсионного возраста, который сам по себе DATA/правовой факт); MODEL —
# зависит от допущения, не наблюдаемого напрямую (весь показатель CG —
# ВСЕГДА класс MODEL: оценённые получатели пенсий района через областной
# коэффициент охвата k_oblast, средняя пенсия и зарплата, зафиксированные на
# последнем наблюдении, ставка занятости, перенесённая с 2024 года; а также
# любой SR/TDR/crossing_year, зависящий от прогнозных узлов 2031+, потому
# что сама возрастная структура на эти годы — модельный прогноз);
# INTERPRETATION — содержательный вердикт по H1/H2/H3; LIMITATION —
# ограничение, способное изменить прочтение вывода. Канонический источник
# чисел — data/final/computed_results.json (14 контрольных метрик) и
# web/public/data/pension.json (полные ряды); правило сверки — AGENT.md.

version: "1.0.0"
frozen_metrics: 2026-07-26      # дата заморозки пререгистрации; PREREGISTRATION.md
primary_series: "base:official"  # базовый сценарий, официальный стартовый ряд (2026)
horizon: { start: 1989, end: 2056 }

claims:

  - claim_id: C-001
    text: >-
      Национальные доли населения младше и старше трудоспособного возраста на
      01.01.2025, посчитанные моделью по возрастной структуре района/страны и
      действующему на 2025 год законному графику (63 муж./58 жен.), совпадают
      с независимо опубликованными абсолютными числами Белстата с отклонением
      в пределах 0,3 п.п. (гейт G-1).
    type: DATA
    metric_ids: [national_age_share_below_working, national_age_share_above_working]
    scope: "страна (BY), 01.01.2025"
    period: { start: 2025, end: 2025 }
    frame: as_is
    source_result:
      file: data/final/computed_results.json
      filter: "g1_share_above_model == 24.56"
      cross_check:
        file: docs/notes/pension_validation.md
        filter: "раздел G-1: доля моложе 16.99% (эталон 17.06%, +-0.063 п.п.), доля старше 24.56% (эталон 24.57%, +-0.016 п.п.)"
    caveats:
      - "Эталон - абсолютные числа PDF-инфографики Белстата на ту же дату (data/raw/pension/registry.csv#belstat_age_shares_2025), а не округлённые проценты Постановления Совмина №765 (17,1%/24,5%) - обе формулировки укладываются в допуск 0,3 п.п."
      - "Если бы G-1 не прошла - раздел 13 ТЗ требует остановки публикации; проверяется автоматически (checks/tests/test_invariants.py, п.6)."
    status: verified

  - claim_id: C-002
    text: >-
      Национальный коэффициент поддержки (SR) по переписям и текущим оценкам
      (1989–2026) снижается с 2,87 (1989) до 2,33 (2026); за прогнозный
      горизонт при базовом сценарии он проходит порог 2,0 в 2038 году и порог
      1,5 в 2050 году.
    type: CALC
    metric_ids: [support_ratio_national, crossing_year_national]
    scope: "страна (BY), as_is, base:official"
    period: { start: 1989, end: 2056 }
    frame: as_is
    source_result:
      file: data/final/computed_results.json
      filter: "national_sr_2009 == 2.73 and national_sr_2046 == 1.68 and national_sr_2056 == 1.41 and national_crossing_year_2_0 == 2038 and national_crossing_year_1_5 == 2050"
      cross_check:
        file: web/public/data/pension.json
        filter: "national.sr.as_is['base:official'] по годам years.national; national.crossing.as_is['base:official']"
    caveats:
      - "Годы 1989-2026 - CALC по прямым данным (переписи/пирамиды/текущая оценка). Годы 2031-2056 формально считаются той же детерминированной формулой SR, но по прогнозным возрастным узлам - см. C-003: точка ряда на 2046/2056 наследует статус MODEL от входа, а не от формулы."
      - "crossing_year(1,5)=2050 и crossing_year(2,0)=2038 приходятся на прогнозный участок ряда -> сами по себе класс MODEL (см. C-003), несмотря на детерминированность формулы интерполяции."
    status: verified

  - claim_id: C-003
    text: >-
      Прогнозные значения SR/TDR (узлы 2031–2056, все 118 районов и страна)
      зависят от базовой демографической модели проекта (CCMPP/Гамильтон-Перри,
      3 сценария × 2 стартовых ряда) и потому классифицируются как MODEL, а не
      CALC, даже там, где сама формула SR/TDR детерминирована.
    type: MODEL
    metric_ids: [support_ratio_national, support_ratio_raion, tdr_national, tdr_raion]
    scope: "страна и 118 районов, узлы 2031-2056, все сценарии и стартовые ряды"
    period: { start: 2031, end: 2056 }
    frame: all
    source_result:
      file: web/public/data/pension.json
      filter: "dtype.national['2031'..'2056'] == 'f' (forecast); dtype.territory аналогично"
    caveats:
      - "Неопределённость растёт с горизонтом: после 2050 показывается диапазон трёх сценариев, а не точка (раздел 8 ТЗ, params/assumptions.yaml)."
      - "Историческая часть ряда (1989/1999/2009/2019, dtype 'c'/'e') - CALC, не MODEL (см. C-002, C-004)."
    status: verified

  - claim_id: C-004
    text: >-
      На районном уровне уже в переписи 2009 года один район (Кореличский,
      SR=1,48) находился ниже порога 1,5 — вопреки исходной формулировке
      пререгистрации H1, ожидавшей нулевую долю таких районов в 2009 году.
    type: CALC
    metric_ids: [support_ratio_raion]
    scope: "r-karelicki (Кореличский район)"
    period: { start: 2009, end: 2009 }
    frame: as_is
    source_result:
      file: data/final/computed_results.json
      filter: "karelicki_sr_2009 == 1.48 and raions_below_1_5_2009 == 1"
      cross_check:
        file: docs/decisions/INF-13.md
        filter: "запись '2026-07-26 — Первый расчёт: H1 технически не выполняется строго (1 район, не 0, в 2009)'"
    caveats:
      - "Не артефакт расчёта: Кореличский район независимо известен как один из устойчиво «самых старых» районов Беларуси по переписям (перепроверено прямым пересчётом переписи-2009 без прогнозного слоя)."
      - "Это единственный район с SR<1,5 в 2009 году; см. C-008 (вердикт H1) для содержательной интерпретации."
    status: verified

  - claim_id: C-005
    text: >-
      К 2046 году доля районов с SR<1,5 (базовый сценарий, официальный старт)
      вырастает до 69 из 118 (58,5%) — против 1 из 118 (0,85%) в 2009 году.
    type: MODEL
    metric_ids: [support_ratio_raion]
    scope: "118 районов, base:official"
    period: { start: 2009, end: 2046 }
    frame: as_is
    source_result:
      file: data/final/computed_results.json
      filter: "raions_below_1_5_2009 == 1 and raions_below_1_5_2046 == 69"
    caveats:
      - "2046 - прогнозный узел (MODEL, см. C-003); 2009 - переписной (CALC, см. C-004)."
      - "Основа H1 (см. C-008 для полного вердикта с оговоркой о факте 2009 года)."
    status: verified

  - claim_id: C-006
    text: >-
      Условная денежная арифметика (contribution_gap, CG) — синтетический
      индекс, а не факт: отношение оценённых пенсионных отчислений района к
      оценённым пенсионным выплатам района при зафиксированных на последнем
      наблюдении зарплате и средней пенсии, оценённой занятости и оценённом
      числе получателей. Показатель Кореличского района к 2046 году (base:official)
      составляет 0,53 — отчисления покрывают около половины оценённых выплат.
    type: MODEL
    metric_ids: [contribution_gap]
    scope: "r-karelicki (Кореличский район); формула применяется ко всем 113 неподавленным районам"
    period: { start: 2026, end: 2056 }
    frame: as_is
    source_result:
      file: data/final/computed_results.json
      filter: "karelicki_cg_2046 == 0.53"
      cross_check:
        file: web/public/data/pension.json
        filter: "territories['r-karelicki'].cg['base:official']['2046'] == 0.53"
    caveats:
      - "ВСЕ компоненты CG - оценки, ни один не наблюдается на уровне района напрямую: получатели пенсий района (k_oblast, областной коэффициент охвата, якорь 2019), средняя пенсия и зарплата (зафиксированы на последнем наблюдаемом уровне для всех прогнозных лет - изолирует демографический эффект, НЕ прогнозирует экономику), занятость 2031+ (ставка занятость/население трудоспособного возраста 2024 года перенесена без изменения)."
      - "ФСЗН - единый общереспубликанский фонд; отдельных пенсионных балансов на уровне района система социального страхования не формирует и не публикует (раздел 8 пререгистрации). CG - индекс для межрайонного сравнения, не показатель реальных денежных потоков района."
      - "Ставка взноса CONTRIB_RATE=0,29 - ТОЛЬКО пенсионное страхование (28% работодатель + 1% работник, ст.5 закона №118-З); отдельные 6% социального страхования в CG не входят (иное назначение фонда)."
      - "Для КОНКРЕТНОГО района CG(y) = K_r * SR(y), где K_r - константа района (не зависит от года) - CG НЕ независимый от SR денежный сигнал, а тот же демографический ряд, пересчитанный в условные деньги при текущем экономическом масштабе района (независимо подтверждено проверяющим-скептиком, docs/decisions/INF-13.md, находка C; см. LIMITATIONS.md, п. a)."
      - "См. C-007 (подавление в зоне доступности Минска) и LIMITATIONS.md пп. (a)-(d)."
    status: verified

  - claim_id: C-007
    text: >-
      CG скрыт для 5 из 118 районов, расположенных в пределах 45 минут
      эффективной транспортной доступности до Минска — запасной вариант при
      непройденной количественной оценке перекоса «место работы vs
      жительства» (гейт G-7): без матрицы корреспонденций поездок оценка
      занятости района систематически завышена маятниковой миграцией.
    type: MODEL
    metric_ids: [contribution_gap]
    scope: "5 районов в зоне 45 мин от Минска (data/curated/travel_times.csv)"
    period: { start: 2026, end: 2056 }
    frame: all
    source_result:
      file: data/final/computed_results.json
      filter: "cg_suppressed_count == 5"
      cross_check:
        file: docs/notes/pension_validation.md
        filter: "раздел G-7: 'CG скрыт для 5 районов в пределах 45 минут эффективной доступности до Минска'"
    caveats:
      - "Оценка перекоса выполнена НЕ количественно (нет матрицы корреспонденций поездок на работу - только времена в пути INF-04, дающие доступность, а не объём миграции); применён предусмотренный ТЗ запасной вариант - полное подавление показа, а не поправочный коэффициент."
      - "cg_suppressed идентичен полю commute_zone_45min для тех же районов (см. checks/tests/test_invariants.py, п.5)."
    status: verified

  - claim_id: C-008
    text: >-
      H1 (расслоение районов по SR к 2046 году) подтверждается в содержательной
      части (58,5% районов ниже SR=1,5 к 2046 году против единичного случая в
      2009), но не в буквальной формулировке: пререгистрация ожидала НОЛЬ
      районов ниже порога в 2009 году, фактически их был один (Кореличский).
    type: INTERPRETATION
    metric_ids: [support_ratio_raion]
    scope: "118 районов"
    period: { start: 2009, end: 2046 }
    frame: as_is
    source_result:
      file: data/final/computed_results.json
      filter: "raions_below_1_5_2009 == 1 and raions_below_1_5_2046 == 69"
      cross_check:
        file: docs/decisions/INF-13.md
        filter: "решение 2026-07-26: голос трёх, вариант (2) - переформулировать текст под факт, подтвердить H1 в содержательной части"
    caveats:
      - "Решение принято голосом трёх (проверяющий-скептик, редактор, третий проверяющий) по правилам раздела 11 ТЗ; замалчивание расхождения запрещено правилами проекта."
      - "118 районов - 118 независимых территорий; порог 1,5 заморожен ДО расчёта (не подобран под результат)."
    status: verified

  - claim_id: C-009
    text: >-
      H2 (рост межрайонного разброса SR) подтверждается формально по
      замороженному критерию (коэффициент вариации SR между районами растёт
      с 0,1907 до 0,193, 2026->2046), но АБСОЛЮТНЫЙ разброс между районами
      (стандартное отклонение, размах) при этом СУЖАЕТСЯ: sd 0,381 -> 0,285
      (-25%), размах 2,31 -> 1,71 (-26%). Страна не столько расслаивается в
      смысле «одни районы улетают вперёд, другие отстают», сколько сходится
      к единому, более низкому общему уровню поддержки.
    type: INTERPRETATION
    metric_ids: [cv_support_ratio, sd_support_ratio]
    scope: "118 районов, base:official"
    period: { start: 2026, end: 2046 }
    frame: as_is
    source_result:
      file: data/final/computed_results.json
      filter: "cv_sr_2026 == 0.1907 and cv_sr_2046 == 0.193 and sd_sr_2026 == 0.3811 and sd_sr_2046 == 0.2849"
      cross_check:
        file: docs/decisions/INF-13.md
        filter: "запись '2026-07-26 — Отчёт проверяющего-скептика', находка B"
    caveats:
      - "Порог опровержения H2 (CV(SR)_2046 <= CV(SR)_2026) не выполнен - формально H2 подтверждена; CV - единственная метрика, замороженная пререгистрацией для этой проверки (раздел 6: 'межрайонный коэффициент вариации SR')."
      - "Независимая проверка проверяющим-скептиком тремя способами (CV, sd, размах) показала: относительный разброс растёт (+1,2%), абсолютный - сужается (sd -25%, размах -26%) - механизм: средний SR по стране падает быстрее (-26%), чем абсолютный разброс вокруг него. Формулировка 'разброс растёт' без этого уточнения вводит в заблуждение (см. LIMITATIONS.md, п. k)."
      - "CV и sd - population statistics (не выборочные) по 118 значениям SR; не взвешены по населению района."
    status: verified

  - claim_id: C-010
    text: >-
      H3 частично опровергнута по собственному контракту опровержения
      пререгистрации: сдвиг crossing_year(1,5) при переходе на график 65/60
      лет в среднем составляет 9,2 года (медиана 9,0) - внутри заявленного
      интервала [8, 12] - но у 27 из 93 районов, проходящих порог 1,5 при
      действующем графике до 2056 года, при графике 65/60 порог НЕ достигается
      в пределах горизонта (crossing_year становится неопределённым) - то есть
      переход «отменяется» смещением за горизонт прогноза, что по букве
      пререгистрации (раздел 7) означает опровержение части «не отменяет
      переход ни в одном районе».
    type: INTERPRETATION
    metric_ids: [policy_delta_crossing_year]
    scope: "93 района с crossing_year_as_is(1,5) <= 2056"
    period: { start: 2026, end: 2056 }
    frame: "as_is vs 65_60"
    source_result:
      file: web/public/data/pension.json
      filter: "territories[*].policy_delta['1.5']['65_60']['base:official'] - среди 93 районов с определённым crossing.as_is['base:official']['1.5']<=2056: среднее=9.24, медиана=9.0, n_с_определённым_сдвигом=66, n_с_неопределённым_(отменённым)_сдвигом=27"
    caveats:
      - "Это НЕ утверждение, что повышение пенсионного возраста «решает проблему» - запрещённая формулировка (раздел 8 пререгистрации); правильное прочтение - сдвигает даты порога, для четверти затронутых районов «отменяет» переход только В ПРЕДЕЛАХ ГОРИЗОНТА 2056 года (после 2056 порог, вероятно, всё равно был бы пройден - экстраполяция за пределы модели не производится)."
      - "Гипотетические графики применяются только с 2026 года включительно (POLICY_APPLIES_FROM), задним числом не переписывают историю (params/assumptions.yaml)."
      - "Это самостоятельная находка данного пакета, не задокументированная ранее в docs/decisions/INF-13.md; выполнена по правилам раздела 11 ТЗ (честная публикация несовпадения с ожиданием, без подгонки)."
    status: verified

  - claim_id: C-011
    text: >-
      Гейт G-3 (независимый бэктест) не пройден на районном уровне: MAPE
      модели (проекция «только дожитие», 2009→2019) 8,86% против MAPE
      наивного прогноза (SR заморожен на уровне 2009) 13,93% - модель точнее
      наивного, но доля районов с верно предсказанным знаком изменения (73,7%)
      ниже требуемых 80%. Следствие: год перехода порога публикуется на
      районном уровне ИНТЕРВАЛОМ («до 2035» / «2035–2045» / «после 2045»), а
      не точной датой.
    type: LIMITATION
    metric_ids: [crossing_year_raion]
    scope: "118 районов"
    period: { start: 2009, end: 2019 }
    frame: backtest
    source_result:
      file: docs/notes/pension_validation.md
      filter: "раздел G-3: mape_model=8.86%, mape_naive=13.93%, correct_sign_share=73.7%, требование >=80% не выполнено -> НЕ ПРОЙДЕНА"
      cross_check:
        file: web/public/data/pension.json
        filter: "territories[*].crossing_interval не null у ВСЕХ 118 районов (meta.validation.G3_backtest == false)"
    caveats:
      - "Замена метода задокументирована в docs/decisions/INF-13.md: районного разреза переписи-1999 не существует, поэтому вместо CCR-модели (откалиброванной именно на паре 2009-2019, что сделало бы бэктест на том же окне самоисполняющимся) использована независимая от неё проекция «только дожитие»."
      - "Национальный crossing_year (см. C-002) НЕ завязан на этот гейт - длинный ряд 1959-2019 плюс внешняя сверка G-4 - и публикуется точным годом."
    status: verified

  - claim_id: C-012
    text: >-
      Гейт G-4 (сверка с UN WPP 2024) формально не пройден: национальный SR-2050
      модели (1,52) расходится с потенциальным коэффициентом поддержки UN WPP
      2024 medium (2,18) на 30,3% - выше порога 5%. Расхождение объясняется
      ДРУГОЙ границей трудоспособности UN (65/65 для обоих полов) против
      законной границы проекта (63 муж./58 жен., структурно ниже, особенно у
      женщин), а не ошибкой расчёта.
    type: LIMITATION
    metric_ids: [support_ratio_national]
    scope: "страна (BY), 2050, base:official"
    period: { start: 2050, end: 2050 }
    frame: as_is
    source_result:
      file: docs/notes/pension_validation.md
