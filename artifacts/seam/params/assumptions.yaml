# Допущения расчёта «Шва на карте» - каждое с обоснованием.
# prereg: true - зафиксировано в PREREGISTRATION.md до расчёта разрывов;
# prereg: false - проверка добавлена ПОСЛЕ фиксации (в estimates.csv: added = 1).
# Значения продублированы константами в code/build.py; варьирование - флагами
# build.py (AGENT.md, задача 3). Флаги пишите в другую папку (--out), чтобы не
# перезаписать data/final/.

sign:
  value: "tau = сосед минус Беларусь у самой линии (d < 0 - Беларусь, d > 0 - сосед)"
  prereg: true
  why: >
    Единое направление для всех пяти участков: плюс - у соседа больше или
    быстрее, минус - больше или быстрее у Беларуси.

estimator:
  value: "локальная линейная RDD: Y = a + tau*[d>0] + b1*d + b2*d*[d>0] + e"
  prereg: true
  why: >
    Стандарт пространственного разрыва (Pinkovskiy 2017 для огней на границах;
    Keele & Titiunik 2015): раздельные наклоны по сторонам, оценка в самой точке
    d = 0. Решение нормальных уравнений и сэндвич-ошибки - на стандартной
    библиотеке (code/build.py: rd()).

bandwidth_km:
  value: 25
  prereg: true
  why: "компромисс между смещением (широкое окно захватывает градиенты) и шумом; h = 15 и 50 км - обязательные проверки"
  vary: "--h 15 | --h 50 (в estimates.csv уже есть спецификации h15 и h50)"

kernel:
  value: "треугольное"
  prereg: true
  why: "вес убывает с расстоянием от линии; равномерное ядро - обязательная проверка (spec = uniform)"

donut_km:
  value: 2
  prereg: true
  why: >
    Ячейки с |d| < 2 км исключены: маски национальных растров, погранзона,
    заборы, расхождение источников границ (geoBoundaries против границы проекта).
  vary: "--donut 5 (стресс: H2 переходит в «частично» за счёт украинского участка; см. AGENT.md)"

donut_dmsp_km:
  value: 10
  prereg: false
  why: "DMSP «засвечивает» соседние пиксели (blooming) на несколько километров; проверка - для исходов DMSP (spec = donut10)"
  vary: "--donut-dmsp 5 | 15"

city_core_km:
  value: 5
  prereg: true
  why: >
    Исключение центров городов от 50 тыс. жителей по обе стороны границы - из
    одного источника, GeoNames cities15000 (отклонение от пререгистрации: там для
    Беларуси указан data.json; единый источник для обеих сторон симметричнее).
    Брест и Гродно у самой линии с белорусской стороны, Вильнюс в 29 км с
    литовской - асимметрия городов сама создала бы «скачок».
  vary: "--city-km 10 (стресс: оценки почти не меняются); spec = with_cities - без исключения"

chernobyl_km:
  value: 35
  prereg: true
  why: "зона отчуждения по обе стороны украинской границы; радиус от ЧАЭС (51.389° с.ш., 30.099° в.д.)"
  vary: "--chern-km 50"

flares_km:
  value: 2.5
  prereg: true
  why: "факелы НПЗ «Нафтан» и Мозырского НПЗ искажают огни (как в INF-08)"

cluster_block_km:
  value: 25
  prereg: true
  why: "кластерно-устойчивые ошибки по блокам 25x25 км в EPSG:3035 - пространственная корреляция соседних ячеек"
  vary: "--block-km 50 (стресс: tau не меняются, меняются только ошибки)"

alpha:
  value: 0.05
  prereg: true
  why: "порог значимости, зафиксированный в пререгистрации; поправка на множественные сравнения не применяется - вердикты требуют значимости на нескольких участках одновременно"

placebo_km:
  value: 30
  prereg: false
  why: "ложные границы в 30 км вглубь каждой стороны (spec = placebo_by / placebo_nb): там скачка быть не должно"
  vary: "--placebo-km 20"

subsegment_fe:
  value: "1° x 1°"
  prereg: false
  why: "фиксированные эффекты подучастков, как у Pinkovskiy (2017): сравнение только внутри одного куска границы (spec = fe_subseg)"

outcomes:
  value:
    B: "Δ ln(1 + м² застройки): WSF 1990→2015 (основной), 1990→2000, 2000→2015; GHSL 1975→1990 (до 1991) и 1990→2015"
    L: "Δ ln(1 + DN) огней Li et al. внутри эпохи: DMSP 1992→2012, 1992→2004, 2004→2012; VIIRS-ряд 2014→2019, 2019→2024"
    C: "Δ доли пашни GLAD 2003→2019, п.п."
    I: "ln(0,1 + нВт) VIIRS VNL 2019 при контроле ln(1 + застройки WSF 2015) и ln(1 + GHS-POP 2020); проверка - только застройка (spec = built_only, prereg: false)"
    level: "уровни 2015–2020 - только контекст, не гипотезы"
  prereg: true
  why: "застройка по построению продуктов только растёт - B измеряет расширение, а не убыль; GHS-POP - только контроль (входные единицы несопоставимы)"

verdict_rules:
  value: "PREREGISTRATION.md §4 (H1–H4); H5 - описательно"
  prereg: true
  why: >
    Вердикты считаются ТОЛЬКО по основной спецификации; проверки, добавленные
    после фиксации, на вердикты не влияют. Код правил - code/build.py: compute();
    независимый пересчёт - checks/tests/test_invariants.py.
