  - { metric: h5_by_median_UA, value: -1.103, tolerance: 0.01,
      description: "H5: медиана годового темпа населения белорусских районов напротив (Украина), %/год" }
  - { metric: verdict_H5, value: 1.0, tolerance: 0,
      description: "вердикт H5 (официальное население, описательно): 1 подтверждена, 0.5 частично, 0 не подтверждена" }
