# Декларативное описание проверяемого пакета INF-20 `seam`
# (ARTIFACT_STANDARD.md v1.0). Сборка: python -m etl.artifacts.build seam
#
# ВАЖНО: data/final/* сборщик КОПИРУЕТ с диска - перед сборкой пересчитайте их:
#   python3 artifacts/seam/code/build.py --cells data/raw/seam/cells.csv.gz \
#       --units-dir data/raw/seam/units
# (то же, что etl/seam.py; при тех же входах seam.json совпадает с
# web/public/data/seam.json побайтно).

id: seam
title: "Шов на карте: Беларусь и соседи по обе стороны границы"
version: "1.0.0"
released: "2026-10-04"
landing_url: "https://by-population-maps.vercel.app/research/seam"
authors:
  - "Проект «Население Беларуси, 1897–2026»"

# files: path - путь внутри пакета; from - путь в репозитории (иначе
# берётся из artifacts/seam/<path>); role: raw|intermediate|final|code|params|docs
files:
  - { path: README.md, role: docs }
  - { path: CHANGELOG.md, role: docs }
  - { path: AGENT.md, role: docs }
  - { path: LIMITATIONS.md, role: docs }
  - { path: PROVENANCE.md, role: docs }
  - { path: CITATION.cff, role: docs }
  - { path: LICENSE.md, role: docs }
  - { path: PREREGISTRATION.md, from: docs/preregistration/seam-v0.1.md, role: docs }
  - { path: sources/registry.csv, role: docs }
  - { path: sources/registry_files.csv, role: docs }
  - { path: sources/raw/cells.csv.gz, from: data/raw/seam/cells.csv.gz,
      role: raw, license: "CC BY 4.0 (производная BY Maps из WSF/GHSL/Li et al./VNL/GLAD - CC BY 4.0 и др., см. LICENSE.md)" }
  - { path: sources/raw/neighbors_adm0.geojson, from: data/raw/seam/neighbors_adm0.geojson,
      role: raw, license: "geoBoundaries gbOpen ADM0: по странам ODbL 1.0 / CC BY 4.0 / Other - Humanitarian (см. properties)" }
  - { path: sources/raw/cities50k.json, from: data/raw/seam/cities50k.json,
      role: raw, license: "CC BY 4.0 (GeoNames cities15000, выжимка)" }
  # H5 (официальное население единиц, описательно): таблицы сборки BY Maps; сырые
  # ответы API (data/raw/seam/units/raw/) не вендорятся - их sha256 в raw/manifest.csv проекта
  - { path: sources/raw/units/units_population.csv, from: data/raw/seam/units/units_population.csv,
      role: raw, license: "официальная статистика (Белстат/BY Maps, GUS, OSP, CSP, Росстат, Госстат Украины, Демоскоп) - со ссылкой на источники; сборка CC BY 4.0" }
  - { path: sources/raw/units/units_geo.csv, from: data/raw/seam/units/units_geo.csv,
      role: raw, license: "центроиды: geoBoundaries/BY Maps, GUGiK PRG, Wikidata (CC0); сборка CC BY 4.0" }
  - { path: sources/raw/units/twins.csv, from: data/raw/seam/units/twins.csv,
      role: raw, license: "официальная статистика (см. units_population.csv); сборка CC BY 4.0" }
  - { path: sources/raw/units/checks.csv, from: data/raw/seam/units/checks.csv,
      role: raw, license: "CC BY 4.0 (самопроверки сборки BY Maps)" }
  - { path: sources/raw/units/SOURCES.md, from: data/raw/seam/units/SOURCES.md,
      role: docs, license: "CC BY 4.0 (описание источников официальных рядов, BY Maps)" }
  - { path: code/build.py, role: code }
  - { path: code/fetch.py, role: code }
  - { path: code/verify.py, role: code }
  - { path: code/run.sh, role: code }
  - { path: code/requirements.lock, role: code }
  - { path: code/extract/seam_extract.py, from: etl/seam_extract.py, role: code }
  - { path: params/assumptions.yaml, role: params }
  - { path: checks/tests/test_invariants.py, role: code }
  - { path: data/final/seam.json, role: final, license: "CC BY 4.0" }
  - { path: data/final/estimates.csv, role: final, license: "CC BY 4.0" }
  - { path: data/final/seam_results.md, role: final, license: "CC BY 4.0" }
  - { path: data/final/computed_results.json, role: final, license: "CC BY 4.0" }

