entrypoints:
  reproduce: "code/run.sh"
  verify: "python3 checks/tests/test_invariants.py"

environment:
  python: ">=3.10"
  lock: "code/requirements.lock"
  seed: null            # расчёт детерминирован, случайности нет

# Контрольные значения: ключевые tau лендинга (основная спецификация) с
# допуском 0.001 (расчёт детерминирован; запас - на платформенное округление
# float), число ячеек и вердикты H1–H5 - точно, медианы H5 - с допуском 0.01. ТОЛЬКО числа: валидатор
# сравнивает abs(got - value) <= tolerance.
expected_results:
  - { metric: tau_C_0319_PL, value: 0.2965, tolerance: 0.001,
      description: "скачок изменения доли пашни GLAD 2003→2019, п.п., Польша минус Беларусь (основная спецификация)" }
  - { metric: tau_C_0319_LT, value: 13.369, tolerance: 0.001,
      description: "скачок изменения доли пашни GLAD 2003→2019, п.п., Литва минус Беларусь (основная спецификация)" }
  - { metric: tau_C_0319_LV, value: 6.93317, tolerance: 0.001,
      description: "скачок изменения доли пашни GLAD 2003→2019, п.п., Латвия минус Беларусь (основная спецификация)" }
  - { metric: tau_C_0319_RU, value: -5.13913, tolerance: 0.001,
      description: "скачок изменения доли пашни GLAD 2003→2019, п.п., Россия минус Беларусь (основная спецификация)" }
  - { metric: tau_C_0319_UA, value: -1.91877, tolerance: 0.001,
      description: "скачок изменения доли пашни GLAD 2003→2019, п.п., Украина минус Беларусь (основная спецификация)" }
  - { metric: tau_lvl_crop19_RU, value: -17.60968, tolerance: 0.001,
      description: "скачок уровня доли пашни 2019, п.п., Россия минус Беларусь" }
  - { metric: tau_lvl_crop19_UA, value: -13.43047, tolerance: 0.001,
      description: "скачок уровня доли пашни 2019, п.п., Украина минус Беларусь" }
  - { metric: tau_L_1924_UA, value: -0.26797, tolerance: 0.001,
      description: "скачок огней 2019→2024, Δln(1+DN), Украина минус Беларусь (H4; война)" }
  - { metric: tau_B_9015_PL, value: -0.13654, tolerance: 0.001,
      description: "скачок роста застройки WSF 1990→2015, Δln, Польша минус Беларусь (H1)" }
  - { metric: tau_B_9015_LT, value: 0.38723, tolerance: 0.001,
      description: "скачок роста застройки WSF 1990→2015, Δln, Литва минус Беларусь (H1)" }
  - { metric: tau_B_9015_LV, value: 0.05889, tolerance: 0.001,
      description: "скачок роста застройки WSF 1990→2015, Δln, Латвия минус Беларусь (H1)" }
  - { metric: tau_B_9015_RU, value: -0.06997, tolerance: 0.001,
      description: "скачок роста застройки WSF 1990→2015, Δln, Россия минус Беларусь (H1)" }
  - { metric: tau_B_9015_UA, value: -0.03146, tolerance: 0.001,
      description: "скачок роста застройки WSF 1990→2015, Δln, Украина минус Беларусь (H1)" }
  - { metric: tau_I_2019_PL, value: -0.13909, tolerance: 0.001,
      description: "скачок яркости VIIRS 2019 при равной застройке и населении, Польша минус Беларусь (H3)" }
  - { metric: tau_I_2019_LT, value: 0.043, tolerance: 0.001,
      description: "скачок яркости VIIRS 2019 при равной застройке и населении, Литва минус Беларусь (H3)" }
  - { metric: tau_I_2019_LV, value: -0.0054, tolerance: 0.001,
      description: "скачок яркости VIIRS 2019 при равной застройке и населении, Латвия минус Беларусь (H3)" }
  - { metric: tau_I_2019_RU, value: 0.01686, tolerance: 0.001,
      description: "скачок яркости VIIRS 2019 при равной застройке и населении, Россия минус Беларусь (H3)" }
  - { metric: tau_I_2019_UA, value: -0.04771, tolerance: 0.001,
      description: "скачок яркости VIIRS 2019 при равной застройке и населении, Украина минус Беларусь (H3)" }
  - { metric: cells_total, value: 234491, tolerance: 0,
      description: "ячеек 1 км в полосе ±52 км вокруг пяти границ (таблица sources/raw/cells.csv.gz)" }
  - { metric: verdict_H1, value: 0.0, tolerance: 0,
      description: "вердикт H1 (государство против географии: скачок в росте застройки) по правилам пререгистрации: 1 подтверждена, 0.5 частично, 0 не подтверждена" }
