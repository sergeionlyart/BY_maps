# Все допущения INF-21 с обоснованиями. Файл ДОКУМЕНТИРУЕТ допущения и кодом
# не читается: для стресс-теста правьте константы в etl/sensors.py и
# перезапускайте code/run.sh — рецепты в AGENT.md.

comparison_unit:
  value: "доля района в сумме по 118 районам и Минску того же датчика и года"
  why: >
    GHS-POP раскладывает внешний национальный итог, свет зависит от калибровки
    сенсора; доли гасят общий уровень обоих эффектов

change_metric:
  value: "Δ = ln(доля конца окна / доля начала); в процентах exp(Δ) − 1"
  why: "симметрична для роста и падения, аддитивна по подокнам"

windows:
  value: {OG: [1990, 2020], OG_robust: [2000, 2020], L_pre: [2013, 2019], L_post: [2021, 2024], L_dmsp: [1992, 2011]}
  why: "заморожены в пререгистрации; окна огней не пересекают стыки сенсоров"

light_seams:
  value: [[2011, 2012], [2020, 2021]]
  why: "переход DMSP → VIIRS и смена обработки VNL (INF-08); 2012 — неполный первый год VIIRS"

dribin:
  value: "Дрибинский район исключён из окон 1990→2020 во всех датчиках"
  why: "восстановлен в 1989 году, официальный ряд с 1991-го (поправка 1)"

official_on_epochs:
  value: "линейная интерполяция годового ряда на эпохи GHS-POP (из INF-15)"
  why: "эпоха 2020 — между переписью 2019 и оценкой 2021; проверяется гейтом V-2"

spearman_p:
  value: "нормальное приближение z = |rho| * sqrt(n - 1)"
  why: "при n = 117–118 точности достаточно; пороги заданы на rho"

minsk_belts:
  value: "0–60, 60–120, 120+ минут до Минска"
  why: "описательная группировка пост-хока, введена после данных"
